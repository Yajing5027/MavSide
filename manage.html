<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MavSide - My Tasks</title>
    <link rel="stylesheet" href="style/theme.css?v=653e02eaf450">
    <link rel="stylesheet" href="style/view.css?v=cc0d2b52fc46">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header aria-label="My tasks page header">
        <div data-include="components/navbar.html"></div>
        <h1>My Tasks</h1>
        <p>Browse your tasks by status, type, and role.</p>
    </header>

    <main id="main-content" role="main" aria-label="My Tasks Management">
        <section aria-label="Task Status Tabs">
            <div id="manage-status-summary" style="margin-bottom: 10px;" role="region" aria-live="polite"></div>

            <div class="task-filter-row">
                <span class="task-filter-item">
                    <label for="task-role-filter">Role</label>
                    <select id="task-role-filter">
                        <option value="all">All</option>
                        <option value="poster">Poster</option>
                        <option value="bringer">Bringer</option>
                    </select>
                </span>
                <span class="task-filter-item">
                    <label for="task-type-filter">Type</label>
                    <select id="task-type-filter">
                        <option value="all">All</option>
                        <option value="order">Order</option>
                        <option value="errand">Errand</option>
                    </select>
                </span>
            </div>

            <div id="unified-task-list" role="region" aria-live="polite" aria-label="Unified task list"></div>
        </section>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="assets/js/main.js?v=d7764c2d285b"></script>
    <script src="assets/js/logger.js?v=59de78106c00"></script>
    <script src="assets/js/modal.js?v=45292fd4a074"></script>
    <script src="assets/js/status-summary-component.js?v=2574ed832639"></script>
    <script src="assets/js/task-progress.js?v=0aa3dcf1b1f5"></script>
    <script src="assets/js/errands-model.js?v=8c422cd79212"></script>
    <script src="assets/js/orders.js?v=9580bdd1c34d"></script>
    <script src="assets/js/manage-orders.js?v=9c00f1cc3b34"></script>
    <script src="assets/js/manage.js?v=8ff59a9b8bd1"></script>
</body>
</html>
