<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Order</title>
    <link rel="stylesheet" href="style/theme.css?v=653e02eaf450">
    <link rel="stylesheet" href="style/view.css?v=cc0d2b52fc46">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header aria-label="Order confirmation page header">
        <div data-include="components/navbar.html"></div>
        <div class="page-title-row">
            <h1>Confirm Your Order</h1>
        </div>
        <p class="hall-slogan">Review your order details and confirm your purchase.</p>
    </header>

    <main id="main-content" role="main" aria-label="Confirm Order">
        <form id="confirm-order-form" aria-label="Confirm order form">
            <h2>Order Details</h2>

            <div id="confirm-order-summary" role="region" aria-live="polite" aria-label="Order summary"></div>

            <div id="order-pickup-location-component"></div>

            <div id="order-delivery-location-component"></div>

            <div id="order-reward-component"></div>

            <div id="order-merchant-note-component"></div>

            <div id="order-courier-note-component"></div>

            <div>
                <button type="submit">Confirm Payment</button>
                <button type="reset">Reset</button>
            </div>

            <p id="confirm-order-message" aria-live="polite"></p>
        </form>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="assets/js/main.js?v=d7764c2d285b"></script>
    <script src="assets/js/account.js?v=dec5125d3103"></script>
    <script src="assets/js/mavaccess.js?v=3c782c8db426"></script>
    <script src="assets/js/notification-center.js?v=26b1532c3950"></script>
    <script src="assets/js/form-components.js?v=d57af1208cd0"></script>
    <script src="assets/js/shopdata.js?v=ed688bb27bc1"></script>
    <script src="assets/js/shops-fixed-data.js?v=5cae6c918406"></script>
    <script src="assets/js/shops.js?v=81056fcdb2f6"></script>
    <script src="assets/js/cart.js?v=18666c84c9c4"></script>
    <script src="assets/js/errands-model.js?v=8c422cd79212"></script>
    <script src="assets/js/orders.js?v=9580bdd1c34d"></script>
    <script src="assets/js/order-confirm.js?v=f0d947da76e6"></script>
</body>
</html>
