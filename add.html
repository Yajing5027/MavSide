<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MavSide Post Task</title>
    <link rel="stylesheet" href="style/theme.css?v=653e02eaf450">
    <link rel="stylesheet" href="style/view.css?v=cc0d2b52fc46">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header aria-label="Post task page header">
        <div data-include="components/navbar.html"></div>
        <div class="page-title-row">
            <h1>Post Task</h1>
        </div>
        <p class="hall-slogan">Paths cross. Things arrive. Campus, closer.</p>
    </header>

    <main id="main-content" role="main" aria-label="Post Task">
        <form id="add-post-form" aria-label="Post task form">
            <h2>Task Details</h2>

            <div>
                <label for="request-content">Title</label>
                <input id="request-content" name="content" type="text" placeholder="e.g., Pick up my package" required>
            </div>

            <div id="type-component" role="group" aria-label="Task type field"></div>

            <div id="pickup-location-component" role="group" aria-label="Pickup location field"></div>

            <div id="delivery-location-component" role="group" aria-label="Delivery location field"></div>

            <div id="reward-component" role="group" aria-label="Reward field"></div>

            <div>
                <label for="deliver-at">Deliver By</label>
                <input id="deliver-at" name="deliver-at" type="text" lang="en-US" placeholder="MM/DD/YYYY hh:mm AM/PM" aria-describedby="deliver-at-us-preview" autocomplete="off">
                <small id="deliver-at-us-preview" class="account-muted">Example: 11/03/2026 2:30 PM</small>
            </div>

            <div id="note-component" role="group" aria-label="Task note field"></div>


            <div class="form-actions-row">
                <button type="submit" id="post-task-submit-btn">Post</button>
                <button type="reset" id="post-task-reset-btn">Reset</button>
            </div>
        </form>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="assets/js/main.js?v=d7764c2d285b"></script>
    <script src="assets/js/ledger.js?v=b38b9a15b6f8"></script>
    <script src="assets/js/account.js?v=dec5125d3103"></script>
    <script src="assets/js/mavaccess.js?v=3c782c8db426"></script>
    <script src="assets/js/campus-places.js?v=f3e7bd1ac29a"></script>
    <script src="assets/js/form-components.js?v=d57af1208cd0"></script>
    <script src="assets/js/add.js?v=0f8e932b3932"></script>
</body>
</html>
